[project]
name = "fake-member-data"
version = "0.1.0"
description = "A project to create fake SF member data that can be shared openly and used for code testing purposes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]
